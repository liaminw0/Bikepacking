<!DOCTYPE html>

<head>

	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <script>
    (() => {
      const root = document.documentElement;
      const meta = document.querySelector('meta[name="color-scheme"]');
      const setTheme = (mode) => {
        root.setAttribute('data-theme', mode);
        if (meta) meta.setAttribute('content', mode === 'dark' ? 'dark light' : 'light dark');
      };
      try {
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        setTheme(saved || (prefersDark ? 'dark' : 'light'));
      } catch (e) {
        setTheme('light');
      }
    })();
  </script>

	<title>Photos | Bikepacking to Istanbul</title>

<script>
(() => {
  const root = document.documentElement;
  const toggle = document.querySelector('.theme-toggle');
  const meta = document.querySelector('meta[name="color-scheme"]');

  const apply = (mode) => {
    root.setAttribute('data-theme', mode);
    if (toggle) toggle.setAttribute('aria-pressed', mode === 'dark');
    if (meta) meta.setAttribute('content', mode === 'dark' ? 'dark light' : 'light dark');
  };

  try {
    const saved = localStorage.getItem('theme');
    const preferred = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    apply(saved || preferred || root.dataset.theme || 'light');
  } catch (e) {
    apply(root.dataset.theme || 'light');
  }

  if (toggle) {
    toggle.addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      apply(next);
      try {
        localStorage.setItem('theme', next);
      } catch (e) {}
    });
  }
})();
</script>
