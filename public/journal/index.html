  <meta name="color-scheme" content="light dark" />
  <script>
    (() => {
      const root = document.documentElement;
      const meta = document.querySelector('meta[name="color-scheme"]');
      const setTheme = (mode) => {
        root.setAttribute('data-theme', mode);
        if (meta) meta.setAttribute('content', mode === 'dark' ? 'dark light' : 'light dark');
      };
      try {
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        setTheme(saved || (prefersDark ? 'dark' : 'light'));
      } catch (e) {
        setTheme('light');
      }
    })();
  </script>

<script>
  (() => {
    const toggle = document.querySelector('.journal-tags__toggle');
    const panel = document.getElementById('journal-tags-panel');
    if (!toggle || !panel || !window.matchMedia) return;

    const mq = window.matchMedia('(max-width: 42rem)');

    const setState = (open) => {
      if (!mq.matches) return;
      panel.classList.toggle('is-open', open);
      panel.style.maxHeight = open ? `${panel.scrollHeight}px` : '0px';
      toggle.setAttribute('aria-expanded', open);
      panel.setAttribute('aria-hidden', (!open).toString());
      toggle.textContent = open ? 'Hide tags' : 'Show tags';
    };

    const handleMediaChange = () => {
      if (!mq.matches) {
        panel.classList.remove('is-open');
        panel.style.maxHeight = '';
        panel.removeAttribute('aria-hidden');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.textContent = 'Show tags';
        return;
      }
      setState(false);
    };

    toggle.addEventListener('click', () => {
      const next = !panel.classList.contains('is-open');
      setState(next);
    });

    mq.addEventListener ? mq.addEventListener('change', handleMediaChange) : mq.addListener(handleMediaChange);
    handleMediaChange();
  })();
</script>

<script>
(() => {
  const root = document.documentElement;
  const toggle = document.querySelector('.theme-toggle');
  const meta = document.querySelector('meta[name="color-scheme"]');

  const apply = (mode) => {
    root.setAttribute('data-theme', mode);
    if (toggle) toggle.setAttribute('aria-pressed', mode === 'dark');
    if (meta) meta.setAttribute('content', mode === 'dark' ? 'dark light' : 'light dark');
  };

  try {
    const saved = localStorage.getItem('theme');
    const preferred = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    apply(saved || preferred || root.dataset.theme || 'light');
  } catch (e) {
    apply(root.dataset.theme || 'light');
  }

  if (toggle) {
    toggle.addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      apply(next);
      try {
        localStorage.setItem('theme', next);
      } catch (e) {}
    });
  }
})();
</script>
